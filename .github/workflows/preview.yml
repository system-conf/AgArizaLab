# Optional: uploads a Cloudflare Workers preview version per branch (`wrangler versions upload`),
# reachable at https://<branch>-agarizalab.<subdomain>.workers.dev. Production is not touched.
# Runs only when the repository has the CLOUDFLARE_API_TOKEN secret; otherwise it skips with a notice.
# Secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID (see README "Testing").
name: Preview deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the preview deploy."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.credentials.outputs.available == 'true' }}
        uses: actions/checkout@v5

      - if: ${{ steps.credentials.outputs.available == 'true' }}
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: npm ci

      - name: Build
        if: ${{ steps.credentials.outputs.available == 'true' }}
        run: npm run build

      - name: Upload preview version
        if: ${{ steps.credentials.outputs.available == 'true' }}
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          # Preview alias = branch name as a DNS label: lowercase, [a-z0-9-], at most 40 characters.
          alias="$(printf '%s' "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' | cut -c1-40 | sed -E 's/-+$//')"
          npx wrangler versions upload --preview-alias "$alias" --message "Preview of ${BRANCH} at ${GITHUB_SHA::7}"
